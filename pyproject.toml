[project]
name = "instree"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "instagrapi>=2.18.0",
    "browser-cookie3>=0.20.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.0",
]

[project.scripts]
instree = "instree.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instree"]

[tool.hatch.build.targets.sdist]
include = ["instree"]
