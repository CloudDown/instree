[project]
name = "instree"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["instagrapi>=2.18.0", "browser-cookie3>=0.20.1"]

[project.scripts]
instree = "instree:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["instree.py"]
