[project]
name = "instree"
version = "0.4.0"
description = "Suivi des abonnements Instagram — Desktop (local) et Web (multi-utilisateurs)"
requires-python = ">=3.11"
dependencies = [
    "instagrapi>=2.18.0",
    "browser-cookie3>=0.20.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "networkx>=3.6.1",
    "itsdangerous>=2.1.0",
]

[project.scripts]
instree = "instree.desktop.cli:main"
instree-web = "instree.web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["instree"]

[tool.hatch.build.targets.sdist]
include = ["instree"]
