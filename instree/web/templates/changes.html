<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instree · Visualisation</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body data-page="{{ page }}">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-line">
        <h1>Instree</h1>
        <span class="brand-sub">Visualisation</span>
      </div>
      <nav class="topnav" aria-label="Navigation principale">
        <a href="/settings" class="topnav-link">Settings</a>
        <a href="/changes" class="topnav-link active">Visualisation</a>
        <a href="/actions" class="topnav-link">Actions</a>
      </nav>
    </div>
  </header>

  <main class="page page-wide">
    <section class="card">
      <h2 class="panel-title">Session</h2>
      <div id="session-box" class="session-box">
        <span id="session-badge" class="session-dot" aria-hidden="true"></span>
        <div>
          <div id="session-user" class="session-user">—</div>
          <div id="header-sub" class="session-source">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <header class="scan-header-bar">
        <div class="scan-nav">
          <button id="btn-prev" type="button" class="nav-btn" title="Scan précédent" disabled aria-label="Scan précédent">←</button>
          <div class="scan-info">
            <time id="scan-date" class="scan-date">—</time>
            <span id="scan-meta" class="scan-meta"></span>
          </div>
          <button id="btn-next" type="button" class="nav-btn" title="Scan suivant" disabled aria-label="Scan suivant">→</button>
        </div>
      </header>

      <div id="content" class="content">
        <p class="empty">Chargement…</p>
      </div>
      <footer class="legend" aria-label="Légende">
        <span><strong>+</strong> nouveau mutuel</span>
        <span><strong>−</strong> mutuel perdu</span>
        <span><strong>~</strong> évolution abonnements</span>
      </footer>
    </section>

    <section class="card">
      <h2 class="panel-title">Historique</h2>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="history-empty hidden">Aucun scan pour l'instant.</p>
    </section>
  </main>

  <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
