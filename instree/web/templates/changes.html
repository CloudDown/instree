<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instree · Home</title>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body data-page="{{ page }}" data-asset-v="{{ v }}">
  {% include "_header.html" %}

  <main class="page page-home">
    <aside class="home-sidebar">
      <section class="card home-scan-card">
        <h2 id="home-scan-title" class="panel-title" data-i18n="actions.title">Lancer un scan</h2>

        <button id="btn-scan" type="button" class="btn btn-main" data-i18n="actions.scanBtn">Lancer un scan</button>

        <details class="advanced" id="advanced-actions">
          <summary data-i18n="actions.advanced">Actions avancées</summary>
          <div class="advanced-body">
            <p class="panel-hint warn" data-i18n="actions.advancedWarn">Plus lent et plus d'appels API.</p>
            <button id="btn-init" type="button" class="btn btn-ghost">
              <span data-i18n="actions.baselineBtn">Baseline</span>
              <span class="btn-desc" data-i18n="actions.baselineDesc">Premier scan ou repartir de zéro</span>
            </button>
          </div>
        </details>

        <div id="job-panel" class="job-panel hidden" role="status" aria-live="polite">
          <div class="job-label" data-i18n="job.running">Scan en cours</div>
          <div class="job-progress">
            <div class="job-sublabel" data-i18n="job.profiles">Profils</div>
            <div class="job-text" id="job-text-profiles">—</div>
            <div class="progress-track"><div id="job-bar-profiles" class="progress-bar"></div></div>
          </div>
          <div id="job-watch-block" class="job-progress hidden">
            <div class="job-sublabel" data-i18n="job.subscriptions">Abonnements</div>
            <div class="job-text" id="job-text-watch">—</div>
            <div class="progress-track"><div id="job-bar-watch" class="progress-bar"></div></div>
          </div>
          <button id="btn-stop-scan" type="button" class="btn btn-ghost job-stop hidden" data-i18n="actions.stopScan">Arrêter le scan</button>
        </div>
      </section>

      <section class="card home-history-card">
        <h2 class="panel-title" data-i18n="changes.history">Historique</h2>
        <ul id="history-list" class="history-list"></ul>
        <p id="history-empty" class="history-empty hidden" data-i18n="changes.historyEmpty">Aucun scan pour l'instant.</p>
      </section>
    </aside>

    <section class="card home-changes-panel">
      <header class="scan-header-bar">
        <div id="scan-subject" class="scan-subject" hidden>
          <div id="scan-subject-user" class="scan-subject-user"></div>
          <div id="scan-subject-sub" class="scan-subject-sub"></div>
        </div>
        <div class="scan-nav">
          <button id="btn-prev" type="button" class="nav-btn" data-i18n-title="changes.prevScan" title="Scan précédent" disabled aria-label="Scan précédent">←</button>
          <div class="scan-info">
            <time id="scan-date" class="scan-date">—</time>
            <span id="scan-meta" class="scan-meta"></span>
          </div>
          <button id="btn-next" type="button" class="nav-btn" data-i18n-title="changes.nextScan" title="Scan suivant" disabled aria-label="Scan suivant">→</button>
        </div>
        <label class="changes-search">
          <span class="visually-hidden" data-i18n="changes.searchLabel">Rechercher un utilisateur</span>
          <input
            type="search"
            id="changes-search"
            class="changes-search-input"
            data-i18n-placeholder="changes.searchPlaceholder"
            placeholder="Rechercher @utilisateur…"
            autocomplete="off"
            spellcheck="false"
          >
        </label>
      </header>

      <div id="content" class="content">
        <p class="empty" data-i18n="changes.loading">Chargement…</p>
      </div>
      <p id="changes-search-empty" class="changes-search-empty hidden" data-i18n="changes.searchEmpty">Aucun résultat pour cette recherche.</p>
      <footer class="legend" aria-label="Légende">
        <button type="button" class="legend-filter" data-filter="list-add" aria-pressed="false">
          <strong class="legend-list-add">&gt;</strong>
          <span data-i18n="changes.legendListAdd">ajouté à ta liste</span>
        </button>
        <button type="button" class="legend-filter" data-filter="add" aria-pressed="false">
          <strong>+</strong>
          <span data-i18n="changes.legendMutualAdd">s'est abonné</span>
        </button>
        <button type="button" class="legend-filter" data-filter="remove" aria-pressed="false">
          <strong>−</strong>
          <span data-i18n="changes.legendMutualRemove">s'est désabonné</span>
        </button>
        <button type="button" class="legend-filter" data-filter="gone" aria-pressed="false">
          <strong class="legend-gone">×</strong>
          <span data-i18n="changes.legendGone">supprimé / renommé</span>
        </button>
        <button type="button" class="legend-filter" data-filter="mutual" aria-pressed="false">
          <span class="badge-mutual legend-badge" data-i18n="changes.badgeMutual">mutuel</span>
          <span data-i18n="changes.legendMutualTarget">déjà dans ta liste</span>
        </button>
        <button type="button" class="legend-filter" data-filter="verified" aria-pressed="false">
          <span class="badge-verified legend-badge"><img src="/static/img/verified-badge.png" alt="" width="14" height="14"></span>
          <span data-i18n="changes.legendVerified">compte vérifié</span>
        </button>
      </footer>
    </section>
  </main>

  {% include "_confirm_dialog.html" %}

  <script src="/static/i18n.js?v={{ v }}"></script>
  <script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
