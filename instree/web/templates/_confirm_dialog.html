<dialog id="confirm-dialog" class="dialog">
  <form method="dialog" class="dialog-box">
    <h3 id="confirm-title" data-i18n="dialog.confirm">Confirmer</h3>
    <p id="confirm-message"></p>
    <div class="dialog-actions">
      <button type="submit" class="btn btn-ghost" value="cancel" data-i18n="dialog.cancel">Annuler</button>
      <button type="submit" class="btn btn-main" id="confirm-ok" value="ok" data-i18n="dialog.confirm">Confirmer</button>
    </div>
  </form>
</dialog>
