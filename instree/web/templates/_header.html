<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-line">
      <h1>Instree</h1>
      <span class="brand-sub" data-i18n="brand.{{ page }}">{{ page }}</span>
    </div>
    <div class="topbar-right">
      <nav class="topnav" aria-label="Navigation principale">
        <a href="/changes" class="topnav-link{% if page == 'changes' %} active{% endif %}" data-i18n="nav.changes">Visualisation</a>
        <a href="/actions" class="topnav-link{% if page == 'actions' %} active{% endif %}" data-i18n="nav.actions">Actions</a>
        <a href="/settings" class="topnav-link{% if page == 'settings' %} active{% endif %}" data-i18n="nav.settings">Paramètres</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="fr">FR</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="es">ES</button>
      </div>
    </div>
  </div>
</header>
