<dialog id="session-alert-dialog" class="dialog dialog-alert">
  <form method="dialog" class="dialog-box">
    <h3 id="session-alert-title" data-i18n="settings.sessionExpiredTitle">Session Instagram expirée</h3>
    <p id="session-alert-message"></p>
    <div class="dialog-actions">
      <button type="submit" class="btn btn-main" value="ok" data-i18n="dialog.ok">OK</button>
    </div>
  </form>
</dialog>
